name: Test credential-backed providers (PR)

on:
  pull_request:
    paths:
      - "clickhouse/**"
      - "databricks/**"
      - "snowflake/**"
      - ".github/workflows/test-clickhouse.yml"
      - ".github/workflows/test-databricks.yml"
      - ".github/workflows/test-snowflake.yml"
      - ".github/workflows/test-live-providers-pr.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        provider: [clickhouse, databricks, snowflake]
    steps:
      - name: Checkout bindings
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.provider }}/go.mod
          cache-dependency-path: ${{ matrix.provider }}/go.sum

      - name: Vet and test
        working-directory: ${{ matrix.provider }}
        run: |
          go vet ./...
          go test ./...
