name: Test credential-backed providers (PR)

on:
  pull_request:
    paths:
      - "clickhouse/**"
      - "databricks/**"
      - "snowflake/**"
      - ".github/workflows/test-clickhouse.yml"
      - ".github/workflows/test-databricks.yml"
      - ".github/workflows/test-snowflake.yml"
      - ".github/workflows/test-live-providers-pr.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        provider: [clickhouse, databricks, snowflake]
    steps:
      - name: Checkout bindings
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: ${{ matrix.provider }}/go.mod
          cache-dependency-path: ${{ matrix.provider }}/go.sum

      - name: Vet and test
        working-directory: ${{ matrix.provider }}
        run: |
          go vet ./...
          go test ./...
